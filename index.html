<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#151b17">
  <title>养殖杨志涛</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f6f7f2;
      --muted: #a5b2a8;
      --surface: #1d2520;
      --surface-strong: rgba(17, 23, 19, 0.88);
      --line: rgba(246, 247, 242, 0.13);
      --green: #39d98a;
      --amber: #f2a04b;
      --blue: #38bdf8;
      --pink: #ef5f7a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #151b17;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #app {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 10px;
      width: 100%;
      height: 100dvh;
      padding: max(12px, env(safe-area-inset-top)) 14px max(10px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 50% 20%, rgba(57, 217, 138, 0.12), transparent 42%),
        linear-gradient(180deg, #17201a 0%, #121814 68%, #101512 100%);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title-block p {
      margin: 0;
      color: var(--amber);
      font-size: 12px;
      font-weight: 700;
    }

    h1 {
      margin: 3px 0 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .level-box {
      min-width: 72px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(17, 23, 19, 0.68);
      text-align: center;
    }

    .level-label {
      display: block;
      color: var(--muted);
      font-size: 10px;
    }

    #level {
      display: block;
      margin-top: 3px;
      font-size: 17px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .growth {
      height: 5px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(246, 247, 242, 0.12);
    }

    #growthBar {
      width: 0%;
      height: 100%;
      border-radius: 99px;
      background: var(--green);
      transition: width 0.24s ease;
    }

    .status-panel {
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-strong);
      backdrop-filter: blur(12px);
    }

    .status-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 9px;
    }

    #mood {
      font-size: 14px;
      font-weight: 750;
    }

    .care-count {
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 12px;
    }

    .status {
      min-width: 0;
    }

    .status:nth-child(5) {
      grid-column: 1 / -1;
    }

    .status-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .status-value {
      color: var(--ink);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .track {
      height: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(246, 247, 242, 0.11);
    }

    .track i {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      transform-origin: left center;
      transition: transform 0.2s ease;
    }

    #hungerBar { background: var(--amber); }
    #thirstBar { background: var(--blue); }
    #energyBar { background: #a78bfa; }
    #happyBar { background: var(--pink); }
    #cleanBar { background: var(--green); }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 0;
      overflow: hidden;
    }

    .stage::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(14px, env(safe-area-inset-bottom));
      height: 32%;
      border-top: 1px solid rgba(246, 247, 242, 0.06);
      background: rgba(57, 217, 138, 0.05);
    }

    .dog {
      position: relative;
      width: min(76vw, 290px);
      aspect-ratio: 1 / 0.92;
      animation: idle 2.8s ease-in-out infinite;
    }

    .shadow {
      position: absolute;
      bottom: 3%;
      left: 50%;
      width: 58%;
      height: 8%;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.28);
      transform: translateX(-50%);
      filter: blur(4px);
    }

    .tail {
      position: absolute;
      right: 13%;
      bottom: 30%;
      width: 15%;
      height: 12%;
      border: 9px solid #d9ddd6;
      border-left-color: transparent;
      border-radius: 50%;
      transform: rotate(-18deg);
      transform-origin: left bottom;
      animation: wag 0.7s ease-in-out infinite alternate;
    }

    .body {
      position: absolute;
      bottom: 12%;
      left: 50%;
      width: 62%;
      height: 36%;
      border-radius: 48% 48% 46% 46%;
      background: linear-gradient(180deg, #f0f2ec 0%, #dbdfd8 100%);
      transform: translateX(-50%);
      box-shadow: inset -8px -8px 0 rgba(0, 0, 0, 0.05);
    }

    .belly {
      position: absolute;
      left: 50%;
      bottom: 8%;
      width: 48%;
      height: 52%;
      border-radius: 50%;
      background: #f8faf5;
      transform: translateX(-50%);
    }

    .leg {
      position: absolute;
      bottom: 5%;
      width: 15%;
      height: 18%;
      border-radius: 9px;
      background: #e6e9e2;
    }

    .leg.front { left: 26%; }
    .leg.back { right: 24%; }

    .head {
      position: absolute;
      top: 2%;
      left: 50%;
      z-index: 2;
      width: 51%;
      aspect-ratio: 1;
      border: 7px solid #e7eae3;
      border-radius: 50%;
      background: #f2f4ee;
      transform: translateX(-50%);
    }

    .ear {
      position: absolute;
      top: -9%;
      width: 20%;
      height: 22%;
      border-radius: 12px 12px 3px 12px;
      background: #cfd4cb;
    }

    .ear.left {
      left: 3%;
      transform: rotate(-18deg);
    }

    .ear.right {
      right: 3%;
      border-radius: 12px 12px 12px 3px;
      transform: rotate(18deg);
    }

    #petAvatar {
      position: absolute;
      inset: 5%;
      width: 90%;
      height: 90%;
      border-radius: 50%;
      object-fit: cover;
      object-position: 50% 14%;
      background: #282e29;
    }

    .collar {
      position: absolute;
      bottom: -4%;
      left: 50%;
      width: 48%;
      height: 11%;
      border-radius: 99px;
      background: var(--pink);
      transform: translateX(-50%);
    }

    .dog.sleeping {
      animation-duration: 5s;
      filter: brightness(0.88);
    }

    .dog.sleeping .tail {
      animation-duration: 2.4s;
    }

    .dog.pop {
      animation: pop 0.42s ease;
    }

    .float-effect {
      position: absolute;
      z-index: 4;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(17, 23, 19, 0.9);
      animation: floatUp 0.9s ease forwards;
      pointer-events: none;
    }

    .icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .float-effect .icon {
      width: 18px;
      height: 18px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 7px;
    }

    .action {
      min-width: 0;
      height: 62px;
      padding: 6px 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #1e2620;
      color: var(--ink);
      font: inherit;
      display: grid;
      grid-template-rows: 20px auto;
      justify-items: center;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .action span {
      max-width: 100%;
      overflow: hidden;
      color: #dfe5dd;
      font-size: 11px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .action:disabled {
      opacity: 0.36;
      cursor: not-allowed;
    }

    .action:not(:disabled):active {
      transform: translateY(1px);
      background: #273028;
    }

    #sleepAction.active {
      color: #06130c;
      background: var(--green);
      border-color: var(--green);
    }

    #sleepAction.active span {
      color: #06130c;
    }

    @keyframes idle {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(-1deg); }
    }

    @keyframes wag {
      from { transform: rotate(-27deg); }
      to { transform: rotate(5deg); }
    }

    @keyframes pop {
      0% { transform: scale(1); }
      35% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(6px) scale(0.7); }
      22% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-72px) scale(0.94); }
    }

    @media (min-width: 700px) {
      #app {
        max-width: 720px;
        margin: 0 auto;
        padding-left: 24px;
        padding-right: 24px;
      }

      .status-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }

      .status:nth-child(5) {
        grid-column: auto;
      }
    }

    @media (max-width: 350px) {
      h1 { font-size: 21px; }
      .action { height: 58px; }
    }
  </style>
</head>
<body>
  <main id="app">
    <svg width="0" height="0" aria-hidden="true">
      <symbol id="icon-food" viewBox="0 0 24 24">
        <path d="M4 13h16a8 8 0 0 1-8 7 8 8 0 0 1-8-7Z"></path>
        <path d="M8 13V8"></path>
        <path d="M16 13V8"></path>
      </symbol>
      <symbol id="icon-water" viewBox="0 0 24 24">
        <path d="M12 21a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5S12.5 4.5 12 2c-.5 2.5-2 4.9-4 6.5S5 12 5 14a7 7 0 0 0 7 7Z"></path>
      </symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
      </symbol>
      <symbol id="icon-ball" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M4 10h16"></path>
        <path d="M12 3c3 3.2 3 14.8 0 18"></path>
      </symbol>
      <symbol id="icon-clean" viewBox="0 0 24 24">
        <path d="M10 3l1.5 4L16 8.5 11.5 10 10 14 8.5 10 4 8.5 8.5 7 10 3Z"></path>
        <path d="M18 14l.9 2.1L21 17l-2.1.9L18 20l-.9-2.1L15 17l2.1-.9L18 14Z"></path>
      </symbol>
    </svg>

    <header class="topbar">
      <div class="title-block">
        <p>虚拟宠物</p>
        <h1>养殖杨志涛</h1>
      </div>
      <div class="level-box">
        <span class="level-label">成长</span>
        <span id="level">1</span>
      </div>
    </header>

    <div class="growth" aria-hidden="true"><i id="growthBar"></i></div>

    <section class="status-panel" aria-label="宠物状态">
      <div class="status-head">
        <span id="mood">状态不错</span>
        <span class="care-count" id="careCount">照顾 0 次</span>
      </div>
      <div class="status-grid">
        <div class="status">
          <div class="status-label"><span>饱食</span><span class="status-value" id="hungerValue">70</span></div>
          <div class="track"><i id="hungerBar"></i></div>
        </div>
        <div class="status">
          <div class="status-label"><span>饮水</span><span class="status-value" id="thirstValue">70</span></div>
          <div class="track"><i id="thirstBar"></i></div>
        </div>
        <div class="status">
          <div class="status-label"><span>精力</span><span class="status-value" id="energyValue">80</span></div>
          <div class="track"><i id="energyBar"></i></div>
        </div>
        <div class="status">
          <div class="status-label"><span>心情</span><span class="status-value" id="happyValue">75</span></div>
          <div class="track"><i id="happyBar"></i></div>
        </div>
        <div class="status">
          <div class="status-label"><span>清洁</span><span class="status-value" id="cleanValue">80</span></div>
          <div class="track"><i id="cleanBar"></i></div>
        </div>
      </div>
    </section>

    <section class="stage" aria-label="小狗杨志涛">
      <div class="dog" id="dog">
        <div class="shadow"></div>
        <div class="tail"></div>
        <div class="body"><div class="belly"></div></div>
        <div class="leg front"></div>
        <div class="leg back"></div>
        <div class="head">
          <div class="ear left"></div>
          <div class="ear right"></div>
          <img id="petAvatar" alt="杨志涛">
          <div class="collar"></div>
        </div>
      </div>
    </section>

    <nav class="actions" aria-label="照顾操作">
      <button class="action" id="foodAction" type="button">
        <svg class="icon" aria-hidden="true"><use href="#icon-food"></use></svg><span>喂食</span>
      </button>
      <button class="action" id="waterAction" type="button">
        <svg class="icon" aria-hidden="true"><use href="#icon-water"></use></svg><span>喂水</span>
      </button>
      <button class="action" id="playAction" type="button">
        <svg class="icon" aria-hidden="true"><use href="#icon-ball"></use></svg><span>玩耍</span>
      </button>
      <button class="action" id="cleanAction" type="button">
        <svg class="icon" aria-hidden="true"><use href="#icon-clean"></use></svg><span>清洁</span>
      </button>
      <button class="action" id="sleepAction" type="button">
        <svg class="icon" aria-hidden="true"><use href="#icon-moon"></use></svg><span>睡觉</span>
      </button>
    </nav>
  </main>

  <script src="avatar.js"></script>
  <script>
    (() => {
      "use strict";

      const storageKey = "yang-zhitao-pet-v1";
      const dog = document.getElementById("dog");
      const petAvatar = document.getElementById("petAvatar");
      const mood = document.getElementById("mood");
      const careCount = document.getElementById("careCount");
      const level = document.getElementById("level");
      const growthBar = document.getElementById("growthBar");
      const stage = document.querySelector(".stage");
      const buttons = {
        food: document.getElementById("foodAction"),
        water: document.getElementById("waterAction"),
        play: document.getElementById("playAction"),
        clean: document.getElementById("cleanAction"),
        sleep: document.getElementById("sleepAction")
      };

      petAvatar.src = AVATAR_SRC;

      const defaultState = {
        hunger: 70,
        thirst: 70,
        energy: 80,
        happy: 75,
        clean: 80,
        xp: 0,
        care: 0,
        sleeping: false,
        last: Date.now()
      };

      let state = loadState();
      let lastTime = performance.now();
      let saveTimer = 0;

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey) || "");
          const merged = { ...defaultState, ...saved };
          const elapsed = Math.min(12 * 60 * 60, Math.max(0, (Date.now() - Number(merged.last || Date.now())) / 1000));
          merged.hunger = clamp(merged.hunger - elapsed * 0.2, 4, 100);
          merged.thirst = clamp(merged.thirst - elapsed * 0.26, 4, 100);
          merged.clean = clamp(merged.clean - elapsed * 0.06, 4, 100);
          merged.energy = clamp(merged.energy - elapsed * 0.11, 4, 100);
          merged.happy = clamp(merged.happy - elapsed * 0.14, 4, 100);
          merged.sleeping = false;
          merged.last = Date.now();
          return merged;
        } catch (_) {
          return { ...defaultState };
        }
      }

      function clamp(value, min = 0, max = 100) {
        return Math.max(min, Math.min(max, value));
      }

      function saveState() {
        state.last = Date.now();
        localStorage.setItem(storageKey, JSON.stringify(state));
      }

      function showFloat(iconId) {
        const effect = document.createElement("div");
        effect.className = "float-effect";
        effect.style.left = `calc(50% + ${(Math.random() * 90 - 45).toFixed(0)}px)`;
        effect.style.top = "24%";
        effect.innerHTML = `<svg class="icon" aria-hidden="true"><use href="#${iconId}"></use></svg>`;
        stage.appendChild(effect);
        effect.addEventListener("animationend", () => effect.remove());
      }

      function popDog() {
        dog.classList.remove("pop");
        requestAnimationFrame(() => dog.classList.add("pop"));
      }

      function applyCare(changes, xp, iconId) {
        if (state.sleeping) return;

        Object.entries(changes).forEach(([key, value]) => {
          state[key] = clamp(state[key] + value);
        });
        state.xp += xp;
        state.care += 1;
        showFloat(iconId);
        popDog();
        render();
        saveState();
      }

      function getMood() {
        if (state.sleeping) return "睡着了";
        if (state.thirst < 20 && state.hunger < 20) return "需要照顾";
        if (state.thirst < 20) return "口渴了";
        if (state.hunger < 20) return "饿了";
        if (state.clean < 22) return "要清洁";
        if (state.energy < 18) return "困了";
        if (state.happy < 25) return "想玩";
        return "状态不错";
      }

      function render() {
        const values = {
          hunger: state.hunger,
          thirst: state.thirst,
          energy: state.energy,
          happy: state.happy,
          clean: state.clean
        };

        Object.entries(values).forEach(([key, value]) => {
          const rounded = Math.round(value);
          document.getElementById(`${key}Bar`).style.transform = `scaleX(${value / 100})`;
          document.getElementById(`${key}Value`).textContent = rounded;
        });

        const currentLevel = 1 + Math.floor(state.xp / 90);
        level.textContent = currentLevel;
        growthBar.style.width = `${((state.xp % 90) / 90) * 100}%`;
        mood.textContent = getMood();
        careCount.textContent = `照顾 ${state.care} 次`;

        dog.classList.toggle("sleeping", state.sleeping);
        buttons.sleep.classList.toggle("active", state.sleeping);
        buttons.sleep.querySelector("span").textContent = state.sleeping ? "醒来" : "睡觉";

        const resting = state.sleeping;
        buttons.food.disabled = resting || state.hunger > 98;
        buttons.water.disabled = resting || state.thirst > 98;
        buttons.play.disabled = resting || state.energy < 10;
        buttons.clean.disabled = resting || state.clean > 98;
      }

      function update(now) {
        requestAnimationFrame(update);
        const dt = Math.min(0.1, (now - lastTime) / 1000);
        lastTime = now;

        state.hunger = clamp(state.hunger - dt * (state.sleeping ? 0.32 : 0.78));
        state.thirst = clamp(state.thirst - dt * (state.sleeping ? 0.38 : 0.94));
        state.clean = clamp(state.clean - dt * (state.sleeping ? 0.04 : 0.21));
        state.happy = clamp(state.happy - dt * (state.sleeping ? 0.08 : 0.5));
        state.energy = clamp(state.energy + dt * (state.sleeping ? 9 : -0.48));

        if (state.hunger < 12 || state.thirst < 12) {
          state.happy = clamp(state.happy - dt * 0.8);
        }

        saveTimer += dt;
        if (saveTimer > 4) {
          saveTimer = 0;
          saveState();
        }
        render();
      }

      buttons.food.addEventListener("click", () => applyCare({ hunger: 24, thirst: -3, happy: 4, energy: 2 }, 12, "icon-food"));
      buttons.water.addEventListener("click", () => applyCare({ thirst: 25, happy: 3 }, 9, "icon-water"));
      buttons.play.addEventListener("click", () => applyCare({ happy: 16, energy: -10, thirst: -5, hunger: -3 }, 10, "icon-ball"));
      buttons.clean.addEventListener("click", () => applyCare({ clean: 35, happy: 2 }, 7, "icon-clean"));
      buttons.sleep.addEventListener("click", () => {
        state.sleeping = !state.sleeping;
        if (!state.sleeping) state.last = Date.now();
        render();
        saveState();
      });

      document.addEventListener("gesturestart", (event) => event.preventDefault());
      window.addEventListener("beforeunload", saveState);
      window.addEventListener("pagehide", saveState);

      render();
      requestAnimationFrame(update);
    })();
  </script>
</body>
</html>
