<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101413">
  <title>杨志涛护盾大作战</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f8f2;
      --muted: #a8b5a9;
      --green: #39d98a;
      --red: #ef5350;
      --amber: #f5b731;
      --panel: rgba(19, 24, 21, 0.9);
      --line: rgba(245, 248, 242, 0.14);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #101413;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    #stage {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: fixed;
      z-index: 3;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .metric {
      min-width: 68px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(12, 16, 14, 0.72);
      backdrop-filter: blur(12px);
    }

    .metric-label {
      display: block;
      font-size: 11px;
      line-height: 1;
      color: var(--muted);
    }

    .metric-value {
      display: block;
      margin-top: 4px;
      font-size: 18px;
      font-weight: 750;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .energy {
      flex: 1;
      max-width: 150px;
    }

    .energy-track {
      height: 8px;
      margin-top: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(245, 248, 242, 0.14);
    }

    #energyBar {
      width: 100%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #2ec27e, var(--green));
      transform-origin: left center;
      transition: transform 0.1s linear;
    }

    .overlay {
      position: fixed;
      z-index: 5;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(8, 11, 9, 0.72);
      backdrop-filter: blur(10px);
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .panel {
      width: min(100%, 360px);
      padding: 26px 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.42);
      text-align: center;
    }

    .eyebrow {
      margin: 0;
      color: var(--amber);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
    }

    h1 {
      margin: 8px 0 12px;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .description {
      margin: 0 auto 20px;
      max-width: 280px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .result {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .result div {
      min-width: 86px;
      padding: 11px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(245, 248, 242, 0.05);
    }

    .result span {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }

    .result strong {
      display: block;
      margin-top: 4px;
      font-size: 20px;
      font-variant-numeric: tabular-nums;
    }

    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      color: #06130c;
      background: var(--green);
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
    }

    button:active {
      transform: translateY(1px);
      filter: brightness(0.92);
    }

    #avatarPreview {
      width: 82px;
      height: 82px;
      margin: 0 auto 16px;
      border: 3px solid var(--green);
      border-radius: 50%;
      background: #222;
      object-fit: cover;
      box-shadow: 0 0 24px rgba(57, 217, 138, 0.26);
    }

    @media (max-width: 360px) {
      h1 {
        font-size: 24px;
      }

      .metric {
        min-width: 60px;
        padding: 7px 8px;
      }
    }
  </style>
</head>
<body>
  <main id="app">
    <canvas id="stage"></canvas>

    <header class="hud">
      <div class="metric">
        <span class="metric-label">分数</span>
        <span class="metric-value" id="scoreValue">0</span>
      </div>
      <div class="metric energy">
        <span class="metric-label">护盾能量</span>
        <span class="energy-track"><i id="energyBar"></i></span>
      </div>
      <div class="metric">
        <span class="metric-label">防护</span>
        <span class="metric-value" id="livesValue">3</span>
      </div>
    </header>

    <div class="overlay" id="overlay">
      <section class="panel">
        <img id="avatarPreview" alt="杨志涛头像">
        <p class="eyebrow" id="overlayEyebrow">非暴力反应挑战</p>
        <h1 id="overlayTitle">杨志涛护盾大作战</h1>
        <p class="description" id="overlayText">点击屏幕释放能量波，在乱流碰到护盾前把它们击碎。能量有限，重物需要两次拦截。</p>
        <div class="result hidden" id="resultBox">
          <div><span>本局</span><strong id="finalScore">0</strong></div>
          <div><span>最高</span><strong id="bestScore">0</strong></div>
        </div>
        <button id="startButton" type="button">开始游戏</button>
      </section>
    </div>
  </main>

  <script src="avatar.js"></script>
  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d");
      const scoreValue = document.getElementById("scoreValue");
      const livesValue = document.getElementById("livesValue");
      const energyBar = document.getElementById("energyBar");
      const overlay = document.getElementById("overlay");
      const overlayEyebrow = document.getElementById("overlayEyebrow");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayText = document.getElementById("overlayText");
      const resultBox = document.getElementById("resultBox");
      const finalScore = document.getElementById("finalScore");
      const bestScore = document.getElementById("bestScore");
      const startButton = document.getElementById("startButton");
      const avatarPreview = document.getElementById("avatarPreview");
      const avatar = new Image();

      avatarPreview.src = AVATAR_SRC;
      avatar.src = AVATAR_SRC;

      let width = 0;
      let height = 0;
      let centerX = 0;
      let centerY = 0;
      let avatarRadius = 72;
      let nextId = 1;
      let lastTime = 0;

      const state = {
        running: false,
        over: false,
        score: 0,
        lives: 3,
        energy: 100,
        time: 0,
        spawnTimer: 0.9,
        shake: 0,
        hurt: 0,
        shots: [],
        waves: [],
        sparks: [],
        labels: []
      };

      function bestKey() {
        return "yang-zhitao-shield-best";
      }

      function getBest() {
        return Number(localStorage.getItem(bestKey()) || 0) || 0;
      }

      function setBest(value) {
        localStorage.setItem(bestKey(), String(value));
      }

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        width = canvas.clientWidth || window.innerWidth;
        height = canvas.clientHeight || window.innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        centerX = width / 2;
        centerY = height * 0.54;
        avatarRadius = Math.max(64, Math.min(108, Math.min(width, height) * 0.18));
      }

      function reset() {
        state.running = true;
        state.over = false;
        state.score = 0;
        state.lives = 3;
        state.energy = 100;
        state.time = 0;
        state.spawnTimer = 0.7;
        state.shake = 0;
        state.hurt = 0;
        state.shots.length = 0;
        state.waves.length = 0;
        state.sparks.length = 0;
        state.labels.length = 0;
        scoreValue.textContent = "0";
        livesValue.textContent = "3";
        updateEnergy();
      }

      function showStart() {
        overlayEyebrow.textContent = "非暴力反应挑战";
        overlayTitle.textContent = "杨志涛护盾大作战";
        overlayText.textContent = "点击屏幕释放能量波，在乱流碰到护盾前把它们击碎。能量有限，重物需要两次拦截。";
        resultBox.classList.add("hidden");
        startButton.textContent = "开始游戏";
        overlay.classList.remove("hidden");
      }

      function showGameOver() {
        state.running = false;
        state.over = true;
        const best = Math.max(getBest(), state.score);
        setBest(best);
        finalScore.textContent = state.score;
        bestScore.textContent = best;
        overlayEyebrow.textContent = "护盾耗尽";
        overlayTitle.textContent = "守住了一阵";
        overlayText.textContent = "乱流越来越密，下一次试着用更少能量完成更多拦截。";
        resultBox.classList.remove("hidden");
        startButton.textContent = "再来一局";
        overlay.classList.remove("hidden");
      }

      function spawnShot() {
        const side = Math.floor(Math.random() * 4);
        const margin = 58;
        const position = margin + Math.random() * (Math.min(width, height) - margin * 2);
        let x = 0;
        let y = 0;

        if (side === 0) {
          x = position;
          y = -margin;
        } else if (side === 1) {
          x = width + margin;
          y = position;
        } else if (side === 2) {
          x = position;
          y = height + margin;
        } else {
          x = -margin;
          y = position;
        }

        const difficulty = Math.min(1, state.time / 58);
        const roll = Math.random();
        const heavy = roll < 0.1 + difficulty * 0.1;
        const fast = !heavy && roll < 0.26 + difficulty * 0.16;
        const angle = Math.atan2(centerY - y, centerX - x) + (Math.random() - 0.5) * 0.14;
        const speed = heavy ? 84 + difficulty * 34 : fast ? 168 + difficulty * 92 : 112 + difficulty * 52;

        state.shots.push({
          id: nextId++,
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: heavy ? 21 : fast ? 10 : 14,
          hp: heavy ? 2 : 1,
          heavy,
          fast,
          spin: Math.random() * Math.PI * 2,
          born: state.time
        });
      }

      function makeWave(x, y) {
        state.waves.push({
          x,
          y,
          r: 12,
          maxR: Math.max(165, Math.min(width, height) * 0.25),
          life: 0,
          maxLife: 0.34,
          hits: new Set()
        });
      }

      function addSparks(x, y, color, count = 12, power = 190) {
      for (let i = 0; i < count; i += 1) {
          const angle = Math.random() * Math.PI * 2;
          const speed = power * (0.35 + Math.random() * 0.65);
          state.sparks.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.42,
            maxLife: 0.42,
            color,
            size: 2 + Math.random() * 3
          });
        }
      }

      function addLabel(x, y, text, color) {
        state.labels.push({ x, y, text, color, life: 0.55 });
      }

      function updateEnergy() {
        energyBar.style.transform = `scaleX(${Math.max(0, state.energy) / 100})`;
      }

      function tap(x, y) {
        if (!state.running || state.energy < 16) return;
        state.energy -= 16;
        updateEnergy();
        makeWave(x, y);
      }

      function update(dt) {
        state.time += dt;
        state.energy = Math.min(100, state.energy + dt * 12);
        updateEnergy();
        state.shake = Math.max(0, state.shake - dt * 3.2);
        state.hurt = Math.max(0, state.hurt - dt * 2.6);

        state.spawnTimer -= dt;
        if (state.spawnTimer <= 0) {
          spawnShot();
          state.spawnTimer = Math.max(0.2, 1.02 - state.time * 0.011) * (0.82 + Math.random() * 0.36);
        }

        for (let i = state.shots.length - 1; i >= 0; i -= 1) {
          const shot = state.shots[i];
          shot.x += shot.vx * dt;
          shot.y += shot.vy * dt;
          shot.spin += dt * (shot.fast ? 9 : 4);
          const distance = Math.hypot(shot.x - centerX, shot.y - centerY);

          if (distance < avatarRadius + shot.r - 6) {
            state.shots.splice(i, 1);
            state.lives -= 1;
            livesValue.textContent = Math.max(0, state.lives);
            state.shake = 1;
            state.hurt = 1;
            addSparks(shot.x, shot.y, shot.heavy ? "#f5b731" : "#ef5350", 18, 230);

            if (state.lives <= 0) {
              showGameOver();
              return;
            }
          }
        }

        for (let i = state.waves.length - 1; i >= 0; i -= 1) {
          const wave = state.waves[i];
          wave.life += dt;
          wave.r = wave.maxR * Math.min(1, wave.life / wave.maxLife);

          for (let j = state.shots.length - 1; j >= 0; j -= 1) {
            const shot = state.shots[j];
            if (wave.hits.has(shot.id)) continue;

            if (Math.hypot(shot.x - wave.x, shot.y - wave.y) < wave.r + shot.r) {
              wave.hits.add(shot.id);
              shot.hp -= 1;
              shot.vx *= 0.42;
              shot.vy *= 0.42;

              if (shot.hp <= 0) {
                const gained = shot.heavy ? 35 : shot.fast ? 18 : 10;
                state.score += gained;
                scoreValue.textContent = state.score;
                state.energy = Math.min(100, state.energy + 5);
                updateEnergy();
                addSparks(shot.x, shot.y, shot.heavy ? "#f5b731" : "#39d98a", shot.heavy ? 20 : 12);
                addLabel(shot.x, shot.y, `+${gained}`, shot.heavy ? "#f5b731" : "#39d98a");
                state.shots.splice(j, 1);
              }
            }
          }

          if (wave.life >= wave.maxLife) {
            state.waves.splice(i, 1);
          }
        }

        for (let i = state.sparks.length - 1; i >= 0; i -= 1) {
          const spark = state.sparks[i];
          spark.life -= dt;
          spark.x += spark.vx * dt;
          spark.y += spark.vy * dt;
          spark.vx *= 0.92;
          spark.vy *= 0.92;
          if (spark.life <= 0) state.sparks.splice(i, 1);
        }

        for (let i = state.labels.length - 1; i >= 0; i -= 1) {
          const label = state.labels[i];
          label.life -= dt;
          label.y -= dt * 48;
          if (label.life <= 0) state.labels.splice(i, 1);
        }
      }

      function drawAvatar() {
        const shakeX = state.shake ? (Math.random() - 0.5) * state.shake * 12 : 0;
        const shakeY = state.shake ? (Math.random() - 0.5) * state.shake * 12 : 0;

        ctx.save();
        ctx.translate(centerX + shakeX, centerY + shakeY);
        ctx.beginPath();
        ctx.arc(0, 0, avatarRadius, 0, Math.PI * 2);
        ctx.closePath();
        ctx.save();
        ctx.clip();
        ctx.fillStyle = "#222826";
        ctx.fillRect(-avatarRadius, -avatarRadius, avatarRadius * 2, avatarRadius * 2);

        if (avatar.complete && avatar.naturalWidth > 0) {
          const sourceSize = avatar.naturalWidth;
          const sourceY = Math.max(0, avatar.naturalHeight * 0.055);
          ctx.drawImage(avatar, 0, sourceY, sourceSize, sourceSize, -avatarRadius, -avatarRadius, avatarRadius * 2, avatarRadius * 2);
        }

        if (state.hurt > 0) {
          ctx.fillStyle = `rgba(239, 83, 80, ${state.hurt * 0.28})`;
          ctx.fillRect(-avatarRadius, -avatarRadius, avatarRadius * 2, avatarRadius * 2);
        }
        ctx.restore();

        ctx.lineWidth = 5;
        ctx.strokeStyle = state.hurt > 0.25 ? "#ef5350" : "#39d98a";
        ctx.stroke();
        ctx.globalAlpha = 0.3 + state.energy / 280;
        ctx.lineWidth = 9;
        ctx.strokeStyle = "#39d98a";
        ctx.beginPath();
        ctx.arc(0, 0, avatarRadius + 12, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      function drawShot(shot) {
        ctx.save();
        ctx.translate(shot.x, shot.y);
        ctx.rotate(shot.spin);
        const color = shot.heavy ? "#f5b731" : shot.fast ? "#ef5350" : "#d66ff0";
        ctx.fillStyle = color;
        ctx.beginPath();

        if (shot.heavy) {
          ctx.rect(-shot.r, -shot.r, shot.r * 2, shot.r * 2);
        } else {
          const sides = shot.fast ? 3 : 6;
          for (let i = 0; i < sides; i += 1) {
            const angle = (i / sides) * Math.PI * 2;
            const x = Math.cos(angle) * shot.r;
            const y = Math.sin(angle) * shot.r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
        }

        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 0.42;
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(-shot.r * 0.24, -shot.r * 0.24, shot.r * 0.24, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        const gradient = ctx.createRadialGradient(centerX, centerY, avatarRadius * 0.5, centerX, centerY, Math.max(width, height));
        gradient.addColorStop(0, "rgba(57, 217, 138, 0.08)");
        gradient.addColorStop(0.45, "rgba(16, 20, 19, 0.94)");
        gradient.addColorStop(1, "#080b09");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        ctx.strokeStyle = "rgba(245, 248, 242, 0.05)";
        ctx.lineWidth = 1;
        for (let x = 30; x < width; x += 48) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }
        for (let y = 30; y < height; y += 48) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }

        drawAvatar();

        state.waves.forEach((wave) => {
          const alpha = 1 - wave.life / wave.maxLife;
          ctx.strokeStyle = `rgba(57, 217, 138, ${alpha * 0.9})`;
          ctx.lineWidth = 8 * alpha + 1;
          ctx.beginPath();
          ctx.arc(wave.x, wave.y, wave.r, 0, Math.PI * 2);
          ctx.stroke();
        });

        state.shots.forEach(drawShot);

        state.sparks.forEach((spark) => {
          ctx.globalAlpha = Math.max(0, spark.life / spark.maxLife);
          ctx.fillStyle = spark.color;
          ctx.beginPath();
          ctx.arc(spark.x, spark.y, spark.size, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;

        ctx.font = "700 16px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif";
        ctx.textAlign = "center";
        state.labels.forEach((label) => {
          ctx.globalAlpha = Math.max(0, label.life / 0.55);
          ctx.fillStyle = label.color;
          ctx.fillText(label.text, label.x, label.y);
        });
        ctx.globalAlpha = 1;
      }

      function loop(time) {
        requestAnimationFrame(loop);
        const dt = Math.min(0.033, (time - lastTime) / 1000 || 0.016);
        lastTime = time;

        if (state.running) update(dt);
        else {
          state.shake = Math.max(0, state.shake - dt * 3);
          state.hurt = Math.max(0, state.hurt - dt * 2);
        }
        draw();
      }

      startButton.addEventListener("click", () => {
        overlay.classList.add("hidden");
        reset();
      });

      canvas.addEventListener("pointerdown", (event) => {
        const rect = canvas.getBoundingClientRect();
        tap(event.clientX - rect.left, event.clientY - rect.top);
      });

      document.addEventListener("gesturestart", (event) => event.preventDefault());
      window.addEventListener("resize", resize);
      window.addEventListener("orientationchange", () => setTimeout(resize, 80));

      bestScore.textContent = getBest();
      resize();
      showStart();
      requestAnimationFrame((time) => {
        lastTime = time;
        requestAnimationFrame(loop);
      });
    })();
  </script>
</body>
</html>
